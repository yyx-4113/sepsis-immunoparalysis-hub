name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify MANIFEST checksums
        run: |
          python - <<'PY'
          import hashlib, csv, sys, os
          ok = True
          with open("MANIFEST.csv") as f:
              r = csv.DictReader(f)
              for row in r:
                  p = row["path"]
                  if not os.path.exists(p):
                      print("MISSING", p); ok = False; continue
                  h = hashlib.sha256(open(p, "rb").read()).hexdigest()
                  if h != row["sha256"]:
                      print("MISMATCH", p); ok = False
          if not ok:
              print("MANIFEST verification FAILED"); sys.exit(1)
          print("MANIFEST verification OK")
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            MANIFEST.csv
            CITATION.cff
            LICENSE
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
